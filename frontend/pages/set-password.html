<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - Student Attendance System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Create your password</h1>
                <p>Choose a private password for your account.</p>
            </div>
            <div id="alert-container"></div>
            <form id="set-password-form" class="login-form">
                <div class="form-group">
                    <label for="password">New password</label>
                    <input type="password" id="password" minlength="6" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" minlength="6" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Save password</button>
            </form>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        const form = document.getElementById('set-password-form');
        const alertContainer = document.getElementById('alert-container');
        if (!localStorage.getItem('access_token')) {
            window.location.href = 'login.html';
        }

        function showMessage(message, type) {
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirmation = document.getElementById('confirm-password').value;
            if (password !== confirmation) {
                showMessage('Passwords do not match.', 'danger');
                return;
            }
            try {
                await api.changePassword(password);
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                user.must_change_password = false;
                localStorage.setItem('user', JSON.stringify(user));
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                showMessage('Password saved. Redirecting to login...', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 1200);
            } catch (error) {
                showMessage(error.message, 'danger');
            }
        });
    </script>
</body>
</html>
